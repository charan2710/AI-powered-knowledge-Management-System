<head>

    <style th:inline="none">
/* =========================================================
   Knowledge OS - Cutting Edge 2026 Glassmorphism Design System
   ========================================================= */

@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');

:root {
    --font-sans: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    
    /* Dark Theme (Default) */
    --bg-main: #090d16;
    --bg-secondary: #0f1626;
    --bg-card: rgba(18, 26, 43, 0.7);
    --bg-card-hover: rgba(26, 36, 60, 0.85);
    --bg-card-elevated: rgba(24, 34, 56, 0.95);
    --bg-glass: rgba(15, 22, 38, 0.75);
    --bg-input: rgba(13, 20, 36, 0.8);
    
    --border-color: rgba(255, 255, 255, 0.08);
    --border-color-hover: rgba(99, 102, 241, 0.4);
    --border-subtle: rgba(255, 255, 255, 0.04);
    
    --text-primary: #f8fafc;
    --text-secondary: #94a3b8;
    --text-muted: #64748b;
    --text-highlight: #ffffff;
    
    --primary: #6366f1;
    --primary-light: #818cf8;
    --primary-dark: #4f46e5;
    --primary-glow: rgba(99, 102, 241, 0.25);
    
    --accent-cyan: #06b6d4;
    --accent-emerald: #10b981;
    --accent-rose: #f43f5e;
    --accent-amber: #f59e0b;
    --accent-purple: #a855f7;
    
    --gradient-primary: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #d946ef 100%);
    --gradient-cyan: linear-gradient(135deg, #06b6d4 0%, #3b82f6 100%);
    --gradient-emerald: linear-gradient(135deg, #10b981 0%, #14b8a6 100%);
    --gradient-rose: linear-gradient(135deg, #f43f5e 0%, #fb7185 100%);
    --gradient-card: linear-gradient(180deg, rgba(255, 255, 255, 0.04) 0%, rgba(255, 255, 255, 0.01) 100%);
    
    --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.2);
    --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.3);
    --shadow-lg: 0 20px 40px rgba(0, 0, 0, 0.4);
    --shadow-glow: 0 0 30px rgba(99, 102, 241, 0.2);
    
    --radius-sm: 8px;
    --radius-md: 14px;
    --radius-lg: 20px;
    --radius-full: 9999px;
}

[data-theme="light"] {
    --bg-main: #f8fafc;
    --bg-secondary: #ffffff;
    --bg-card: rgba(255, 255, 255, 0.85);
    --bg-card-hover: #ffffff;
    --bg-card-elevated: #ffffff;
    --bg-glass: rgba(255, 255, 255, 0.8);
    --bg-input: #f1f5f9;
    
    --border-color: rgba(0, 0, 0, 0.08);
    --border-color-hover: rgba(99, 102, 241, 0.5);
    --border-subtle: rgba(0, 0, 0, 0.04);
    
    --text-primary: #0f172a;
    --text-secondary: #475569;
    --text-muted: #94a3b8;
    --text-highlight: #020617;
    
    --primary-glow: rgba(99, 102, 241, 0.15);
    --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
    --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.06);
    --shadow-lg: 0 20px 40px rgba(0, 0, 0, 0.08);
    --shadow-glow: 0 0 25px rgba(99, 102, 241, 0.12);
}

/* =========================================================
   Base & Ambient Background
   ========================================================= */

* {
    box-sizing: border-box;
}

body {
    background-color: var(--bg-main);
    color: var(--text-primary);
    font-family: var(--font-sans);
    min-height: 100vh;
    overflow-x: hidden;
    margin: 0;
    transition: background-color 0.3s ease, color 0.3s ease;
    background-image: 
        radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.09) 0%, transparent 45%),
        radial-gradient(circle at 90% 10%, rgba(6, 182, 212, 0.07) 0%, transparent 40%),
        radial-gradient(circle at 50% 90%, rgba(168, 85, 247, 0.08) 0%, transparent 50%);
    background-attachment: fixed;
    position: relative;
}

/* Ambient Background Floating Orbs */
.ambient-orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(100px);
    pointer-events: none;
    z-index: 0;
    opacity: 0.45;
    animation: orbFloat 20s infinite alternate ease-in-out;
}

.orb-1 {
    width: 450px;
    height: 450px;
    background: radial-gradient(circle, rgba(99, 102, 241, 0.4) 0%, rgba(99, 102, 241, 0) 70%);
    top: -100px;
    left: 10%;
}

.orb-2 {
    width: 400px;
    height: 400px;
    background: radial-gradient(circle, rgba(6, 182, 212, 0.35) 0%, rgba(6, 182, 212, 0) 70%);
    top: 30%;
    right: -50px;
    animation-delay: -7s;
}

.orb-3 {
    width: 500px;
    height: 500px;
    background: radial-gradient(circle, rgba(168, 85, 247, 0.3) 0%, rgba(168, 85, 247, 0) 70%);
    bottom: -100px;
    left: 25%;
    animation-delay: -14s;
}

@keyframes orbFloat {
    0% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(30px, -40px) scale(1.08); }
    100% { transform: translate(-20px, 30px) scale(0.95); }
}

.kos-app {
    position: relative;
    z-index: 1;
}

/* =========================================================
   Glass Navbar
   ========================================================= */

.app-navbar {
    background: var(--bg-glass) !important;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border-color);
    padding: 14px 24px;
    position: sticky;
    top: 0;
    z-index: 1020;
    transition: all 0.3s ease;
}

.brand-gradient {
    font-weight: 800;
    font-size: 1.25rem;
    letter-spacing: -0.02em;
    background: var(--gradient-primary);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    text-decoration: none;
}

.brand-icon-box {
    width: 36px;
    height: 36px;
    border-radius: var(--radius-sm);
    background: var(--gradient-primary);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    box-shadow: 0 4px 12px rgba(99, 102, 241, 0.35);
    color: white;
}

/* AI Status Badge */
.ai-status-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    border-radius: var(--radius-full);
    font-size: 0.75rem;
    font-weight: 600;
    background: rgba(16, 185, 129, 0.1);
    color: var(--accent-emerald);
    border: 1px solid rgba(16, 185, 129, 0.25);
}

.pulse-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background-color: var(--accent-emerald);
    box-shadow: 0 0 8px var(--accent-emerald);
    animation: pulseGlow 2s infinite;
}

@keyframes pulseGlow {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(1.3); }
}

/* Spotlight Search */
.search-wrapper {
    position: relative;
    max-width: 520px;
    width: 100%;
}

.search-input {
    background: var(--bg-input) !important;
    border: 1px solid var(--border-color) !important;
    color: var(--text-primary) !important;
    border-radius: var(--radius-full) !important;
    padding: 10px 48px 10px 42px !important;
    font-size: 0.875rem !important;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}

.search-input:focus {
    border-color: var(--primary) !important;
    box-shadow: 0 0 0 4px var(--primary-glow) !important;
    background: var(--bg-secondary) !important;
}

.search-icon {
    position: absolute;
    left: 15px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    pointer-events: none;
}

.kbd-shortcut {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid var(--border-color);
    color: var(--text-secondary);
    padding: 2px 7px;
    border-radius: 6px;
    font-size: 0.7rem;
    font-weight: 600;
    pointer-events: none;
}

/* Theme Toggle Button */
.btn-theme-toggle {
    width: 38px;
    height: 38px;
    border-radius: var(--radius-full);
    border: 1px solid var(--border-color);
    background: var(--bg-card);
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s ease;
}

.btn-theme-toggle:hover {
    color: var(--primary);
    border-color: var(--primary);
    transform: rotate(15deg);
}

/* =========================================================
   Stat Cards with Ambient Halos & Trend Lines
   ========================================================= */

.stat-card-glass {
    position: relative;
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-lg);
    padding: 20px;
    overflow: hidden;
    transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    backdrop-filter: blur(12px);
}

.stat-card-glass::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: var(--card-accent, var(--gradient-primary));
    opacity: 0.8;
}

.stat-card-glass:hover {
    transform: translateY(-4px);
    border-color: var(--border-color-hover);
    box-shadow: var(--shadow-md), 0 0 25px var(--card-glow, rgba(99, 102, 241, 0.15));
}

.stat-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
}

.stat-icon {
    width: 44px;
    height: 44px;
    border-radius: var(--radius-md);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.25rem;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid var(--border-color);
}

.stat-number {
    font-size: 2rem;
    font-weight: 800;
    letter-spacing: -0.03em;
    color: var(--text-highlight);
    margin: 0;
    line-height: 1;
}

.stat-label {
    font-size: 0.8125rem;
    font-weight: 600;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.04em;
}

.stat-badge {
    font-size: 0.725rem;
    padding: 3px 8px;
    border-radius: var(--radius-full);
    font-weight: 600;
}

/* =========================================================
   Sidebar / Quick Filters Rail
   ========================================================= */

.filter-glass-sidebar {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-lg);
    padding: 12px;
    backdrop-filter: blur(12px);
}

.filter-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    border-radius: var(--radius-md);
    color: var(--text-secondary);
    font-weight: 500;
    font-size: 0.875rem;
    text-decoration: none;
    transition: all 0.2s ease;
    border: 1px solid transparent;
    margin-bottom: 4px;
    cursor: pointer;
}

.filter-item:hover {
    color: var(--text-primary);
    background: rgba(255, 255, 255, 0.04);
}

.filter-item.active {
    color: #ffffff;
    background: var(--primary);
    box-shadow: 0 4px 14px rgba(99, 102, 241, 0.35);
    font-weight: 600;
}

.category-chip-btn {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    padding: 8px 12px;
    border-radius: var(--radius-sm);
    background: transparent;
    border: 1px solid transparent;
    color: var(--text-secondary);
    font-size: 0.8125rem;
    transition: all 0.2s ease;
    text-align: left;
    margin-bottom: 2px;
    cursor: pointer;
}

.category-chip-btn:hover {
    background: rgba(255, 255, 255, 0.05);
    color: var(--text-primary);
    transform: translateX(3px);
}

.category-chip-btn.active {
    background: rgba(99, 102, 241, 0.15);
    color: var(--primary-light);
    border-color: rgba(99, 102, 241, 0.3);
    font-weight: 600;
}

/* Horizontal Category Filter Pills */
.category-pills-rail {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 6px;
    scrollbar-width: thin;
}

.category-pills-rail::-webkit-scrollbar {
    height: 4px;
}

.category-pills-rail::-webkit-scrollbar-thumb {
    background: var(--border-color);
    border-radius: 4px;
}

.pill-filter {
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 14px;
    border-radius: var(--radius-full);
    font-size: 0.8125rem;
    font-weight: 500;
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    color: var(--text-secondary);
    cursor: pointer;
    transition: all 0.2s ease;
}

.pill-filter:hover {
    border-color: var(--primary);
    color: var(--text-primary);
}

.pill-filter.active {
    background: var(--gradient-primary);
    color: white;
    border-color: transparent;
    box-shadow: 0 2px 10px rgba(99, 102, 241, 0.3);
}

/* =========================================================
   Knowledge Cards (Cutting Edge 2026)
   ========================================================= */

.knowledge-card-glass {
    position: relative;
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-lg);
    padding: 22px;
    height: 100%;
    display: flex;
    flex-direction: column;
    transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    backdrop-filter: blur(12px);
    overflow: hidden;
}

.knowledge-card-glass::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: var(--radius-lg);
    padding: 1px;
    background: linear-gradient(135deg, rgba(255,255,255,0.1), transparent 60%);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
}

.knowledge-card-glass:hover {
    transform: translateY(-5px);
    border-color: var(--border-color-hover);
    box-shadow: var(--shadow-lg), 0 0 25px rgba(99, 102, 241, 0.15);
    background: var(--bg-card-hover);
}

.card-top-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
}

.source-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 10px;
    border-radius: var(--radius-full);
    font-size: 0.725rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.03em;
}

.source-badge.website {
    background: rgba(6, 182, 212, 0.12);
    color: var(--accent-cyan);
    border: 1px solid rgba(6, 182, 212, 0.25);
}

.source-badge.pdf {
    background: rgba(244, 63, 94, 0.12);
    color: var(--accent-rose);
    border: 1px solid rgba(244, 63, 94, 0.25);
}

.category-badge-glass {
    font-size: 0.725rem;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: var(--radius-full);
    background: rgba(168, 85, 247, 0.1);
    color: var(--accent-purple);
    border: 1px solid rgba(168, 85, 247, 0.2);
}

.knowledge-title {
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--text-highlight);
    margin-bottom: 8px;
    line-height: 1.4;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
}

.knowledge-summary {
    color: var(--text-secondary);
    font-size: 0.85rem;
    line-height: 1.55;
    margin-bottom: 16px;
    flex-grow: 1;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
}

.tag-pill-modern {
    display: inline-flex;
    align-items: center;
    font-size: 0.7rem;
    font-weight: 500;
    padding: 2px 8px;
    border-radius: var(--radius-sm);
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid var(--border-subtle);
    color: var(--text-muted);
    margin-right: 4px;
    margin-bottom: 4px;
}

.card-footer-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-top: 14px;
    border-top: 1px solid var(--border-subtle);
    font-size: 0.775rem;
    color: var(--text-muted);
}

/* Floating Action Toolbar on Cards */
.card-actions-toolbar {
    display: flex;
    gap: 6px;
    margin-top: 14px;
}

.btn-card-action {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 7px 12px;
    border-radius: var(--radius-sm);
    font-size: 0.8125rem;
    font-weight: 600;
    border: 1px solid var(--border-color);
    background: rgba(255, 255, 255, 0.03);
    color: var(--text-primary);
    cursor: pointer;
    transition: all 0.2s ease;
    text-decoration: none;
}

.btn-card-action:hover {
    background: rgba(255, 255, 255, 0.08);
    border-color: var(--border-color-hover);
    color: var(--text-highlight);
}

.btn-card-action.primary {
    background: var(--primary);
    border-color: var(--primary);
    color: white;
    flex-grow: 1;
}

.btn-card-action.primary:hover {
    background: var(--primary-dark);
    box-shadow: 0 4px 12px rgba(99, 102, 241, 0.35);
}

.btn-card-action.danger:hover {
    background: rgba(244, 63, 94, 0.15);
    border-color: var(--accent-rose);
    color: var(--accent-rose);
}

/* =========================================================
   Floating Copilot AI Drawer / Dock
   ========================================================= */

.floating-copilot-trigger {
    position: fixed;
    bottom: 24px;
    right: 24px;
    z-index: 1050;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 20px;
    border-radius: var(--radius-full);
    background: var(--gradient-primary);
    color: white;
    border: none;
    font-weight: 700;
    font-size: 0.925rem;
    box-shadow: 0 10px 25px rgba(99, 102, 241, 0.4), 0 0 20px rgba(139, 92, 246, 0.3);
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.floating-copilot-trigger:hover {
    transform: translateY(-3px) scale(1.03);
    box-shadow: 0 14px 30px rgba(99, 102, 241, 0.5), 0 0 30px rgba(139, 92, 246, 0.45);
}

/* =========================================================
   Modals & Details Viewer
   ========================================================= */

.modal-content-glass {
    background: var(--bg-card-elevated) !important;
    border: 1px solid var(--border-color) !important;
    border-radius: var(--radius-lg) !important;
    backdrop-filter: blur(24px) !important;
    color: var(--text-primary) !important;
    box-shadow: var(--shadow-lg) !important;
}

.modal-header-glass {
    border-bottom: 1px solid var(--border-color);
    padding: 18px 24px;
}

.modal-body-glass {
    padding: 24px;
}

.modal-footer-glass {
    border-top: 1px solid var(--border-color);
    padding: 14px 24px;
}

.custom-nav-tabs {
    border-bottom: 1px solid var(--border-color);
    display: flex;
    gap: 8px;
    margin-bottom: 18px;
}

.custom-nav-tabs button {
    background: transparent;
    border: none;
    color: var(--text-secondary);
    padding: 8px 14px;
    font-size: 0.85rem;
    font-weight: 600;
    border-bottom: 2px solid transparent;
    cursor: pointer;
    transition: all 0.2s ease;
}

.custom-nav-tabs button:hover {
    color: var(--text-primary);
}

.custom-nav-tabs button.active {
    color: var(--primary);
    border-bottom-color: var(--primary);
}

/* Drag and Drop PDF Studio */
.pdf-dropzone {
    border: 2px dashed var(--border-color);
    border-radius: var(--radius-md);
    padding: 36px 20px;
    text-align: center;
    background: rgba(255, 255, 255, 0.02);
    cursor: pointer;
    transition: all 0.25s ease;
}

.pdf-dropzone:hover, .pdf-dropzone.dragover {
    border-color: var(--primary);
    background: rgba(99, 102, 241, 0.06);
    box-shadow: 0 0 20px var(--primary-glow);
}

/* Chat Messages */
.chat-bubble-user {
    align-self: flex-end;
    background: var(--gradient-primary);
    color: white;
    border-radius: 16px 16px 4px 16px;
    padding: 12px 18px;
    max-width: 82%;
    font-size: 0.9rem;
    line-height: 1.5;
    box-shadow: 0 4px 14px rgba(99, 102, 241, 0.25);
}

.chat-bubble-ai {
    align-self: flex-start;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid var(--border-color);
    color: var(--text-primary);
    border-radius: 16px 16px 16px 4px;
    padding: 14px 18px;
    max-width: 88%;
    font-size: 0.9rem;
    line-height: 1.6;
}

.chat-prompt-suggestion {
    font-size: 0.75rem;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid var(--border-color);
    color: var(--text-secondary);
    padding: 4px 10px;
    border-radius: var(--radius-full);
    cursor: pointer;
    transition: all 0.2s ease;
}

.chat-prompt-suggestion:hover {
    border-color: var(--primary);
    color: var(--primary-light);
    background: rgba(99, 102, 241, 0.08);
}

/* Toast Notifications */
.knowledge-toast {
    position: fixed;
    bottom: 24px;
    left: 24px;
    z-index: 1100;
    padding: 12px 18px;
    border-radius: var(--radius-md);
    background: var(--bg-card-elevated);
    border: 1px solid var(--border-color);
    color: var(--text-primary);
    font-size: 0.875rem;
    font-weight: 500;
    box-shadow: var(--shadow-lg);
    display: flex;
    align-items: center;
    gap: 10px;
    backdrop-filter: blur(16px);
    transform: translateY(100px);
    opacity: 0;
    transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    pointer-events: none;
}

.knowledge-toast.show {
    transform: translateY(0);
    opacity: 1;
    pointer-events: auto;
}

/* Category scroll list in sidebar */
.category-scroll-list {
    max-height: 320px;
    overflow-y: auto;
    scrollbar-width: thin;
}
.category-scroll-list::-webkit-scrollbar {
    width: 4px;
}
.category-scroll-list::-webkit-scrollbar-thumb {
    background: var(--border-color);
    border-radius: 4px;
}
